<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<div class="panel">
  <h2>Usuários da equipe</h2>
  <div class="msg erro" th:if="${erro}" th:text="${erro}"></div>
  <div class="msg ok" th:if="${ok}" th:text="${ok}"></div>
  <table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>
      <tr th:each="u : ${lista}">
        <td th:text="${u.nome}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.role.name() == 'ADMIN'} ? 'Administrador' : 'Usuário'"></td>
        <td th:text="${u.ativo} ? 'Ativo' : 'Desativado'"></td>
        <td>
          <form th:action="@{/usuarios/{id}/alternar(id=${u.id})}" method="post">
            <button class="mini" type="submit" th:text="${u.ativo} ? 'Desativar' : 'Reativar'"></button>
          </form>
          <form th:action="@{/usuarios/{id}/senha(id=${u.id})}" method="post">
            <input type="password" name="senha" placeholder="Nova senha" minlength="8" required style="width:120px">
            <button class="mini" type="submit">Trocar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <h3>Novo usuário</h3>
  <form class="grid" th:action="@{/usuarios}" method="post">
    <label>Nome<input name="nome" required></label>
    <label>E-mail<input type="email" name="email" required></label>
    <label>Senha (mínimo 8 caracteres)<input type="password" name="senha" minlength="8" required></label>
    <label>Perfil<select name="role"><option value="USER">Usuário</option><option value="ADMIN">Administrador</option></select></label>
    <div class="actions w"><button class="btn" type="submit">Criar usuário</button></div>
  </form>
</div>
</body>
</html>
