<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Painel')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>

<section class="stats">
  <div class="stat"><b th:text="${total}">0</b><span>leads cadastrados</span></div>
  <div class="stat"><b th:text="'R$ ' + ${#numbers.formatDecimal(valorAberto,1,'POINT',0,'COMMA')}">R$ 0</b><span>valor em aberto no funil</span></div>
  <div class="stat"><b th:text="${conversao} + '%'">0%</b><span>conversão (ganhos ÷ encerrados)</span></div>
  <div class="stat"><b th:text="${parados}">0</b><span>sem contato há 7+ dias</span></div>
</section>

<form class="filters" method="get" th:action="@{/}">
  <input type="search" name="q" th:value="${q}" placeholder="Buscar por nome ou empresa">
  <select name="prioridade" onchange="this.form.submit()">
    <option value="">Todas as prioridades</option>
    <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p.label}" th:selected="${fPrioridade == p}"></option>
  </select>
  <select name="origem" onchange="this.form.submit()">
    <option value="">Todas as origens</option>
    <option th:each="o : ${origens}" th:value="${o}" th:text="${o.label}" th:selected="${fOrigem == o}"></option>
  </select>
  <select name="responsavel" onchange="this.form.submit()">
    <option value="">Todos os responsáveis</option>
    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome}" th:selected="${fResponsavel == u.id}"></option>
  </select>
  <button class="btn sec" type="submit">Filtrar</button>
</form>

<main class="board">
  <div class="col" th:each="etapa : ${etapas}" th:attr="data-etapa=${etapa.name()}">
    <h2><span th:text="${etapa.label}">Etapa</span>
      <small th:text="${colunas.get(etapa).size()} + ' · R$ ' + ${#numbers.formatDecimal(totais.get(etapa),1,'POINT',0,'COMMA')}"></small></h2>
    <div class="empty" th:if="${colunas.get(etapa).isEmpty()}">Nenhum lead nesta etapa.</div>
    <div th:each="lead : ${colunas.get(etapa)}" class="card" draggable="true"
         th:classappend="${lead.prioridade.name().toLowerCase()}" th:attr="data-id=${lead.id}">
      <strong th:text="${lead.nome}">Nome</strong>
      <span class="meta" th:text="(${lead.empresa} ?: '') + (${#strings.isEmpty(lead.empresa)} ? '' : ' – ') + ${lead.tipo.label}">Empresa</span>
      <div class="row">
        <span class="tag" th:classappend="${lead.prioridade.name().toLowerCase()}" th:text="${lead.prioridade.label} + ' (' + ${lead.pontuacao} + ')'"></span>
        <span th:text="'R$ ' + ${#numbers.formatDecimal(lead.orcamento,1,'POINT',0,'COMMA')}"></span>
      </div>
      <div class="row">
        <span th:class="${etapa.aberta and lead.diasSemContato >= 7} ? 'late' : 'meta'"
              th:text="${lead.diasSemContato == 0} ? 'contato hoje' : 'há ' + ${lead.diasSemContato} + ' d sem contato'"></span>
        <span class="meta" th:if="${lead.responsavel != null}" th:text="${lead.responsavel.nome}"></span>
      </div>
      <div class="row">
        <a th:if="${lead.telefone != null and !lead.telefone.isBlank()}" target="_blank" rel="noopener"
           th:href="'https://wa.me/55' + ${#strings.replace(#strings.replace(#strings.replace(#strings.replace(lead.telefone,' ',''),'(',''),')',''),'-','')}">WhatsApp</a>
        <span th:unless="${lead.telefone != null and !lead.telefone.isBlank()}"></span>
        <form th:if="${etapa.ordinal() lt 5}" th:action="@{/leads/{id}/avancar(id=${lead.id})}" method="post">
          <button class="mini" type="submit" title="Avançar etapa" aria-label="Avançar etapa">›</button>
        </form>
      </div>
    </div>
  </div>
</main>
<script th:src="@{/js/board.js}"></script>
</body>
</html>
