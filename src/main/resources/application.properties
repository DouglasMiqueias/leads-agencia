# Sem variáveis de ambiente, usa H2 em arquivo (bom para testar). Em produção, defina DB_URL para o PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/leads;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.servlet.session.timeout=8h
# Administrador criado na primeira execução (troque a senha depois do primeiro login)
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@agencia.com}
app.admin.senha=${ADMIN_SENHA:trocar123}
# Necessário atrás de proxy HTTPS (Caddy/Nginx): respeita X-Forwarded-* nos redirecionamentos
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
