services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
    volumes:
      - dbdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/leads
      DB_USER: leads
      DB_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agencia.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-trocar123}
volumes:
  dbdata:
