<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="${titulo} + ' · Leads'">Leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap">
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="top" th:fragment="topo">
  <a class="brand" th:href="@{/}"><img th:src="@{/img/logo.png}" alt="DevWeb"><span class="sub">Painel de leads</span></a>
  <nav>
    <span class="meta" sec:authentication="name">usuário</span>
    <a class="btn sec" th:href="@{/leads/exportar.csv}">Exportar CSV</a>
    <a class="btn sec" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuários</a>
    <a class="btn" th:href="@{/leads/novo}">Novo lead</a>
    <form th:action="@{/logout}" method="post"><button class="btn sec" type="submit">Sair</button></form>
  </nav>
</header>
</body>
</html>
